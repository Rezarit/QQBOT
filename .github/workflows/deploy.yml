name: QQ机器人自动部署

on:
  push:
    branches:
      - v0.2-feat-user-memory

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检查代码
        uses: actions/checkout@v4
        
      - name: 自动部署到腾讯云服务器
        uses: appleboy/ssh-action@master
        with:
          host: 82.157.177.158
          username: root
          key: ${{ secrets.QQBOT }}
          port: 22
          script: |
            # 进入项目目录
            cd /root/QQBOT/
            
            # 拉取最新代码
            git pull origin v0.2-feat-user-memory
            
            # 停止并删除旧容器
            docker-compose down
            
            # 构建并启动新容器
            docker-compose up -d --build
            
            # 清理无用镜像
            docker image prune -f
            
            # 检查服务状态
            echo "=== 部署完成，服务状态 ==="
            docker-compose ps
            echo "=== 最近日志 ==="
            docker-compose logs --tail=10