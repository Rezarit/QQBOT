version: '3.8'

services:
  napcatqq:
    image: suzukirenz/napcatqq:latest
    container_name: napcatqq
    ports:
      - "3001:3001"
      - "6099:6099"  # 添加 WebUI 端口映射
    environment:
      - TZ=Asia/Shanghai
    restart: always
    volumes:
      - ./onebot11_2596899231.json:/app/napcat/config/onebot11_2596899231.json  # 使用正确的文件名
    networks:
      - qq-bot-network

  qq-bot-star:
    build: .
    container_name: qq-bot-star
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
    restart: always
    networks:
      - qq-bot-network
    depends_on:
      napcatqq:
        condition: service_started

networks:
  qq-bot-network:
    driver: bridge