services:
  # Qdrant - 向量数据库
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # Qdrant API 端口
      - "6334:6334"  # Qdrant 仪表盘端口
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - qq-bot-network

  # NapCatQQ - QQ 机器人协议端
  napcatqq:
    image: suzukirenz/napcatqq:latest
    container_name: napcatqq
    ports:
      - "13001:3001"  # WebSocket服务端口，避免与秒杀系统冲突
      - "16099:6099"  # WebUI管理界面端口，避免与秒杀系统冲突
    environment:
      - TZ=Asia/Shanghai
    restart: always
    volumes:
      - ./onebot11_2596899231.json:/app/napcat/config/onebot11_2596899231.json
    networks:
      - qq-bot-network

  # QQ Bot Star - 主程序
  qq-bot-star:
    build: .
    container_name: qq-bot-star
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - ./.env:/app/.env
      - ./data:/app/data  # 挂载本地 data 目录，持久化数据库
    environment:
      - TZ=Asia/Shanghai
    restart: always
    networks:
      - qq-bot-network
    depends_on:
      napcatqq:
        condition: service_started
      qdrant:
        condition: service_started

networks:
  qq-bot-network:
    driver: bridge

volumes:
  qdrant_data: