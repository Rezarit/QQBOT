version: '3.8'

services:
  napcatqq:
    image: suzukirenz/napcatqq:latest
    container_name: napcatqq
    ports:
      - "13001:3001"  # WebSocket服务端口，避免与秒杀系统冲突
      - "16099:6099"  # WebUI管理界面端口，避免与秒杀系统冲突
    environment:
      - TZ=Asia/Shanghai
    restart: always
    volumes:
      - ./onebot11_2596899231.json:/app/napcat/config/onebot11_2596899231.json
    networks:
      - qq-bot-network

  qq-bot-star:
    build: .
    container_name: qq-bot-star
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
    restart: always
    networks:
      - qq-bot-network
    depends_on:
      napcatqq:
        condition: service_started

networks:
  qq-bot-network:
    driver: bridge