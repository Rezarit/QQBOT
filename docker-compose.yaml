services:
  # SillyTavern - 对话管理服务
  sillytavern:
    image: goolashe/sillytavern:stable
    container_name: sillytavern
    ports:
      - "8080:8000"  # 映射容器的8000端口到主机的8080端口
    environment:
      - TZ=Asia/Shanghai
    restart: always
    volumes:
      - ./sillytavern_data:/app/data  # 持久化SillyTavern数据
      - ./sillytavern_data/config.yaml:/home/node/app/config/config.yaml  # 挂载自定义配置
    networks:
      - qq-bot-network

  # NapCatQQ - QQ 机器人协议端
  napcatqq:
    image: mlikiowa/napcat-docker:latest
    container_name: napcatqq
    ports:
      - "13001:3001"  # WebSocket服务端口，避免与秒杀系统冲突
      - "16099:6099"  # WebUI管理界面端口，避免与秒杀系统冲突
    environment:
      - TZ=Asia/Shanghai
    restart: always
    volumes:
      - ./onebot11_2596899231.json:/app/napcat/config/onebot11_2596899231.json
    networks:
      - qq-bot-network

  # QQ Bot Star - 主程序
  qq-bot-star:
    build: .
    container_name: qq-bot-star
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - TZ=Asia/Shanghai
    restart: always
    networks:
      - qq-bot-network
    depends_on:
      napcatqq:
        condition: service_started
      sillytavern:
        condition: service_started

networks:
  qq-bot-network:
    driver: bridge