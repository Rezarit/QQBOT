services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qqbot-napcat
    restart: unless-stopped
    environment:
      - MODE=astrbot          # 生成指向 astrbot:6199 的反向 WS 配置
      - WEBUI_TOKEN=${WEBUI_TOKEN:-changeme-please-set-a-real-token}
      # 变量写在同目录 .env 文件里（已 gitignore），不要改这一行
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:6099:6099" # NapCat WebUI
    volumes:
      - ./data/qq:/app/.config/QQ        # QQ 登录态（扫码后生成，务必保留）
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/plugins:/app/napcat/plugins
    networks:
      - qqbot_net

  astrbot:
    image: soulter/astrbot:latest
    container_name: qqbot-astrbot
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "6185:6185"   # AstrBot WebUI
    volumes:
      - ./data/astrbot:/AstrBot/data
    networks:
      - qqbot_net

networks:
  qqbot_net:
    driver: bridge
